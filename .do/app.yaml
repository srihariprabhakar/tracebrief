name: tracebrief
region: nyc
services:
  - name: web
    github:
      repo: srihariprabhakar/tracebrief
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8787
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /api/health
    envs:
      - key: DATA_DIR
        value: /tmp/tracebrief-data
        scope: RUN_TIME
        type: GENERAL
