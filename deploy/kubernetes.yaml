apiVersion: v1
kind: Namespace
metadata:
  name: tracebrief
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tracebrief-data
  namespace: tracebrief
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracebrief
  namespace: tracebrief
  labels:
    app.kubernetes.io/name: tracebrief
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tracebrief
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracebrief
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: tracebrief
          image: ghcr.io/srihariprabhakar/tracebrief:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: DATA_DIR
              value: /var/lib/tracebrief
          volumeMounts:
            - name: data
              mountPath: /var/lib/tracebrief
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tracebrief-data
---
apiVersion: v1
kind: Service
metadata:
  name: tracebrief
  namespace: tracebrief
spec:
  selector:
    app.kubernetes.io/name: tracebrief
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tracebrief
  namespace: tracebrief
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "70"
spec:
  ingressClassName: nginx
  rules:
    - host: tracebrief.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracebrief
                port:
                  name: http
